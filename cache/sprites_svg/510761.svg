    <path d="M96,72 C80,65 30,55 20,62 C18,63 20,67 25,67 C50,65 80,72 93,78 Z"/>
    <!-- Right upper wing -->
    <path d="M104,72 C120,65 170,55 180,62 C182,63 180,67 175,67 C150,65 120,72 107,78 Z"/>
    <!-- Left lower wing -->
