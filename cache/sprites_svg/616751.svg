<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="#000000">
    <!-- Main central body - globular/cylindrical cactus -->
    <ellipse cx="100" cy="115" rx="52" ry="62"/>
    <!-- Left offset cluster -->
    <ellipse cx="55" cy="135" rx="32" ry="40"/>
    <!-- Right offset cluster -->
    <ellipse cx="148" cy="130" rx="30" ry="38"/>
    <!-- Small cluster front left -->
    <ellipse cx="72" cy="155" rx="22" ry="28"/>
    <!-- Small cluster front right -->
    <ellipse cx="130" cy="152" rx="20" ry="26"/>
    <!-- Spine tufts on main body - top -->
    <circle cx="100" cy="55" r="5"/>
    <circle cx="115" cy="58" r="4"/>
    <circle cx="85" cy="58" r="4"/>
    <circle cx="125" cy="67" r="4"/>
    <circle cx="75" cy="67" r="4"/>
    <!-- Spine tufts rows -->
    <circle cx="132" cy="80" r="4"/>
    <circle cx="68" cy="80" r="4"/>
    <circle cx="140" cy="95" r="4"/>
    <circle cx="60" cy="95" r="4"/>
    <circle cx="143" cy="112" r="4"/>
    <circle cx="57" cy="112" r="4"/>
    <!-- Spine tips on left cluster -->
    <circle cx="28" cy="115" r="4"/>
    <circle cx="24" cy="130" r="4"/>
    <circle cx="26" cy="147" r="4"/>
    <!-- Spine tips on right cluster -->
    <circle cx="173" cy="110" r="4"/>
    <circle cx="175" cy="125" r="4"/>
    <circle cx="172" cy="142" r="4"/>
    <!-- Top crown spines radiating -->
    <ellipse cx="100" cy="51" rx="3" ry="7" transform="rotate(-15,100,51)"/>
    <ellipse cx="100" cy="51" rx="3" ry="7" transform="rotate(15,100,51)"/>
    <ellipse cx="100" cy="51" rx="2" ry="6"/>
    <!-- Base ground line suggestion -->
    <ellipse cx="100" cy="178" rx="72" ry="8"/>
  </g>
</svg>