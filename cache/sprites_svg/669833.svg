<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="#000000">
    <!-- Main spherical cactus body -->
    <ellipse cx="100" cy="108" rx="72" ry="70"/>
    <!-- Ribs/spines radiating outward from top -->
    <!-- Spine cluster 1 - top center -->
    <ellipse cx="100" cy="38" rx="5" ry="12" transform="rotate(0 100 108)"/>
    <!-- Spine cluster 2 -->
    <ellipse cx="100" cy="38" rx="4" ry="11" transform="rotate(30 100 108)"/>
    <!-- Spine cluster 3 -->
    <ellipse cx="100" cy="38" rx="4" ry="11" transform="rotate(-30 100 108)"/>
    <!-- Spine cluster 4 -->
    <ellipse cx="100" cy="38" rx="4" ry="10" transform="rotate(60 100 108)"/>
    <!-- Spine cluster 5 -->
    <ellipse cx="100" cy="38" rx="4" ry="10" transform="rotate(-60 100 108)"/>
    <!-- Spine cluster 6 -->
    <ellipse cx="100" cy="38" rx="4" ry="9" transform="rotate(90 100 108)"/>
    <!-- Spine cluster 7 -->
    <ellipse cx="100" cy="38" rx="4" ry="9" transform="rotate(-90 100 108)"/>
    <!-- Spine cluster 8 -->
    <ellipse cx="100" cy="38" rx="3" ry="8" transform="rotate(120 100 108)"/>
    <!-- Spine cluster 9 -->
    <ellipse cx="100" cy="38" rx="3" ry="8" transform="rotate(-120 100 108)"/>
    <!-- Spine cluster 10 -->
    <ellipse cx="100" cy="38" rx="3" ry="7" transform="rotate(150 100 108)"/>
    <!-- Spine cluster 11 -->
    <ellipse cx="100" cy="38" rx="3" ry="7" transform="rotate(-150 100 108)"/>
    <!-- Rib lines carved out (lighter areas to show ribs) - use the body ellipse as base -->
    <!-- Flowering crown at top -->
    <ellipse cx="100" cy="55" rx="18" ry="12"/>
    <!-- Flower petals -->
    <ellipse cx="100" cy="44" rx="8" ry="10"/>
    <ellipse cx="100" cy="44" rx="8" ry="10" transform="rotate(40 100 55)"/>
    <ellipse cx="100" cy="44" rx="8" ry="10" transform="rotate(-40 100 55)"/>
    <ellipse cx="100" cy="44" rx="8" ry="10" transform="rotate(80 100 55)"/>
    <ellipse cx="100" cy="44" rx="8" ry="10" transform="rotate(-80 100 55)"/>
    <!-- Small base/pot suggestion -->
    <ellipse cx="100" cy="175" rx="40" ry="8"/>
    <rect x="65" y="170" width="70" height="12" rx="4"/>
  </g>
</svg>